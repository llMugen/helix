inherits = "catppuccin_mocha"

"ui.cursor.primary.insert" = { fg = "black", bg = "Mauve"}
"constant" = { fg = "Sapphire"}
"punctuation" = { fg = "Text"}
"markup.bold" = { fg = "Red" }
"markup.italic" = { fg = "Yellow"}
